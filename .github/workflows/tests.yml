name: tests

on:
  push:
    branches: [main]
  pull_request:

# A second push to a PR makes the first run pointless; don't pay for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what Railway's builder actually uses. Testing only 3.11 let a
        # dependency pin through that had no wheel for 3.13, so the deployment
        # silently fell back to compiling it from source - green here, and a
        # build that would not finish there.
        python-version: ["3.11", "3.13"]

    # A real pgvector, because the vector-store tests skip without one - and a
    # skipped test protects nothing. This suite has now been bitten three times
    # by tests that reported green while asserting nothing.
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dataforge
          POSTGRES_PASSWORD: dataforge
          POSTGRES_DB: dataforge_vectors
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataforge -d dataforge_vectors"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      VECTOR_DATABASE_URL: postgresql://dataforge:dataforge@127.0.0.1:5432/dataforge_vectors

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Without the language data the OCR tests skip, and a skipped test
      # cannot catch the regression it exists for. These are the same packages
      # the deployment installs via RAILPACK_DEPLOY_APT_PACKAGES.
      - name: Install tesseract with Hindi and Telugu language data
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin tesseract-ocr-tel

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the suite
        run: python -m pytest tests/ -q

      # A green run that skipped these would report exactly what the original
      # bugs looked like: everything passing, scanned PDFs unreadable and the
      # search index untested.
      - name: The OCR and vector-store tests must actually run
        run: |
          set -o pipefail
          python -m pytest tests/test_ocr.py tests/test_vector_store.py tests/test_reindex_end_to_end.py -q -rs | tee guard.log
          if grep -q "skipped" guard.log; then
            echo "::error::Tests skipped - tesseract, pymupdf or pgvector is missing from this runner."
            exit 1
          fi

  frontend:
    name: frontend (build + node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` is `tsc && vite build`, so this typechecks too.
      - name: Typecheck and build
        run: npm run build

      - name: Run the suite
        run: npm test
