name: container

# Builds the backend's Docker image and publishes it to GitHub Container
# Registry, so any host can run the same image: Azure App Service pulls it
# (see deploy/AZURE.md). Pull requests only build it, which proves the
# Dockerfile still works before anything is merged.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/juliesdutt-spec/mining_report_platform
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      # Set in the repository's Actions secrets once the Azure web app exists.
      AZURE_CD_WEBHOOK: ${{ secrets.AZURE_CD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and publish, on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/render.Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # App Service's continuous-deployment webhook makes it pull :latest now
      # rather than at its next restart.
      - name: Tell Azure to pull the new image
        if: env.PUBLISH == 'true' && env.AZURE_CD_WEBHOOK != ''
        run: curl -fsS -X POST "$AZURE_CD_WEBHOOK" -o /dev/null
