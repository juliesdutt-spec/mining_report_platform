<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataForge — CMPDI / CIL Mining Intelligence</title>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-variable.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/geist-mono-latin-variable.woff2" crossorigin>
    <link rel="preload" href="/fonts/poppins-600-wordmark.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      /* The boot screen only. Everything else is in the built stylesheet;
         these few rules are inline so the first paint does not wait on a
         second request. The colours are the --background, --foreground and
         --muted-foreground tokens resolved to hex, so the screen React
         replaces this with is painted on the same ground and there is no
         flash between the two. */
      #app-boot {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #f8fafc;
        color: #5e6d82;
        font: 400 13px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #app-boot .mark {
        font: 600 22px/1 Poppins, Inter, ui-sans-serif, system-ui, sans-serif;
        letter-spacing: -0.01em;
        color: #182035;
      }
      #app-boot .mark i {
        font-style: normal;
        color: #ff791a; /* --brand */
      }
      :root.dark #app-boot {
        background: #090e1a;
        color: #94a3b8;
      }
      :root.dark #app-boot .mark {
        color: #f1f5f9;
      }
      :root.dark #app-boot .mark i {
        color: #ff8e3d; /* --brand, lifted for slate */
      }
      #app-boot noscript {
        max-width: 34ch;
        text-align: center;
      }
    </style>
    <noscript>
      <style>
        /* Nothing is loading, so saying so is a promise nothing will keep. */
        #app-boot-note {
          display: none;
        }
      </style>
    </noscript>
    <script>
      // No-FOUC theme bootstrap. DataForge is light-first; only opt into dark
      // when the viewer has explicitly saved that preference.
      (function () {
        try {
          if (localStorage.getItem("dataforge-theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="overflow-hidden selection:bg-primary/20">
    <!-- Measured on a 400 kbps connection, the bundle takes about 4.5s to
         mount and until then #root was empty: four and a half seconds of
         white, with not even the wordmark to say the page was loading. This
         is in the HTML itself, so it paints as soon as the stylesheet above
         parses — about 1.2s on that same connection — and main.tsx removes it
         when React takes over. -->
    <div id="root">
      <div id="app-boot">
        <div class="mark">Data<i>forge</i></div>
        <div id="app-boot-note">Loading the indexed reports…</div>
        <noscript>
          DataForge reads and reconciles mining reports in the browser, so it
          needs JavaScript enabled. Turn it on for this site and reload.
        </noscript>
      </div>
    </div>
    <script>
      // A bundle that never arrives would leave "Loading the indexed reports…"
      // on screen for ever — measured: block the script and the page still
      // says it six seconds later, and would at six hours. 12s is well past
      // the ~4.5s a 400 kbps connection needs, so reaching this means the
      // request failed rather than that it is slow.
      setTimeout(function () {
        var note = document.getElementById("app-boot-note");
        if (!note) return; // React took over, as it should have
        note.textContent =
          "DataForge could not finish loading. Check the connection and reload the page.";
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
